# Aviso de aprovacao da Globals (ver GOVERNANCA.md, "Revisao e aprovacao").
# Chamado por .github/workflows/globals-aprovacao.yml de cada repo. Quando o PR fica PRONTO (revisao de IA feita,
# conversas resolvidas, checks verdes), pede a aprovacao humana no Google Chat marcando quem pode aprovar, e deixa
# um comentario no PR. Uma vez por commit. Nunca falha o PR: se faltar algo, so registra no log e sai.
#
# Configuracao (fora do repo, sem dado pessoal versionado):
#   secret GCHAT_APROVACAO_WEBHOOK  webhook do espaco do Google Chat
#   variavel APROVADORES_CHAT       {"pessoas":{"login":"id-google"},"times":{"org/time":["login"]},
#                                    "padrao":["login"],"repos":{"repo":["login"]}}
name: aprovacao

on:
  workflow_call:
    secrets:
      GCHAT_APROVACAO_WEBHOOK:
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  statuses: read

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Pedir aprovacao quando o PR estiver pronto
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          WEBHOOK: ${{ secrets.GCHAT_APROVACAO_WEBHOOK }}
          APROVADORES: ${{ vars.APROVADORES_CHAT }}
        shell: python3 {0}
        run: |
          import fnmatch, json, os, re, sys, time, urllib.parse, urllib.request

          REPO, PR = os.environ["REPO"], os.environ["PR"]
          TOKEN = os.environ["GH_TOKEN"]
          API = "https://api.github.com"
          ESPERA_CHECKS = 20 * 60
          MARCA = "aviso-aprovacao"

          def fim(msg):
              print(msg)
              sys.exit(0)

          def req(url, data=None, method=None, headers=None):
              h = {"Authorization": f"Bearer {TOKEN}", "Accept": "application/vnd.github+json",
                   "X-GitHub-Api-Version": "2022-11-28"}
              h.update(headers or {})
              body = json.dumps(data).encode() if data is not None else None
              r = urllib.request.Request(url, data=body, method=method, headers=h)
              with urllib.request.urlopen(r, timeout=30) as resp:
                  return json.loads(resp.read() or b"null"), resp.headers.get("Link", "")

          def gh(path):
              return req(path if path.startswith("http") else f"{API}/{path}")[0]

          def gh_todos(path):
              out, url = [], f"{API}/{path}{'&' if '?' in path else '?'}per_page=100"
              while url:
                  page, link = req(url)
                  out += page if isinstance(page, list) else page.get("check_runs", [])
                  m = re.search(r'<([^>]+)>;\s*rel="next"', link)
                  url = m.group(1) if m else None
              return out

          def gql(query, **variables):
              return req(f"{API}/graphql", {"query": query, "variables": variables}, "POST")[0]

          def principal():
              pr = gh(f"repos/{REPO}/pulls/{PR}")
              if pr["state"] != "open" or pr["draft"]:
                  fim("PR fechado ou em rascunho.")
              head = pr["head"]["sha"]
              autor = pr["user"]["login"]
              comentarios = gh_todos(f"repos/{REPO}/issues/{PR}/comments")
              if any(f"<!-- {MARCA}:{head} -->" in (c.get("body") or "") for c in comentarios):
                  fim(f"Aprovacao ja pedida para {head[:7]}.")

              reviews = gh_todos(f"repos/{REPO}/pulls/{PR}/reviews")
              humanos = [r for r in reviews if r["user"]["type"] != "Bot" and r["user"]["login"] != autor]
              ultima = {}
              for r in humanos:
                  if r["state"] in ("APPROVED", "CHANGES_REQUESTED", "DISMISSED"):
                      ultima[r["user"]["login"]] = r
              if any(r["state"] == "APPROVED" and r["commit_id"] == head for r in ultima.values()):
                  fim("Ja aprovado neste commit.")

              # 1. Revisao de IA do commit atual
              commit = gh(f"repos/{REPO}/commits/{head}")
              data_head = commit["commit"]["committer"]["date"]
              ia = None
              for r in reviews:
                  if r["user"]["type"] == "Bot" and r["commit_id"] == head and r["user"]["login"] != "github-actions[bot]":
                      ia = f"{r['user']['login']} revisou {head[:7]}"
              for c in comentarios:
                  if c["user"]["type"] == "Bot" and "codex" in c["user"]["login"] and c["created_at"] >= data_head:
                      ia = f"{c['user']['login']} revisou {head[:7]}"
              for x in gh_todos(f"repos/{REPO}/issues/{PR}/reactions"):
                  if x["content"] == "+1" and "codex" in x["user"]["login"] and x["created_at"] >= data_head:
                      ia = f"{x['user']['login']} sem apontamentos em {head[:7]}"
              # Revisao feita fora do GitHub (Claude/Codex local), registrada no PR com o veredito e o commit
              veredito = None
              for c in sorted(comentarios + reviews, key=lambda c: c.get("created_at") or c.get("submitted_at") or ""):
                  b = c.get("body") or ""
                  m = re.search(r"VEREDITO:\s*\**\s*(APROVADO|REPROVADO)", b, re.I)
                  if m and head[:7] in b:
                      veredito = m.group(1).upper()
              if veredito == "REPROVADO":
                  fim("Ultimo veredito da revisao de IA neste commit: REPROVADO.")
              if veredito == "APROVADO":
                  ia = f"revisao de IA aprovou {head[:7]}"
              if not ia:
                  fim(f"Aguardando a revisao de IA do commit {head[:7]}.")

              # 2. Conversas resolvidas
              dono, nome = REPO.split("/")
              q = """query($o:String!,$n:String!,$p:Int!){repository(owner:$o,name:$n){pullRequest(number:$p){
                     reviewThreads(first:100){nodes{isResolved}}}}}"""
              fios = gql(q, o=dono, n=nome, p=int(PR))["data"]["repository"]["pullRequest"]["reviewThreads"]["nodes"]
              abertos = sum(1 for f in fios if not f["isResolved"])
              if abertos:
                  fim(f"{abertos} conversa(s) sem resolver.")

              # 3. Checks verdes (espera os que ainda rodam)
              inicio = time.time()
              while True:
                  runs = [r for r in gh_todos(f"repos/{REPO}/commits/{head}/check-runs")
                          if not r["name"].startswith("avisar") and "aprovacao" not in r["name"]]
                  ruins = [r["name"] for r in runs if r["status"] == "completed"
                           and r["conclusion"] not in ("success", "neutral", "skipped")]
                  estado = gh(f"repos/{REPO}/commits/{head}/status")
                  if ruins or estado["state"] == "failure" or estado["state"] == "error":
                      fim(f"Checks com falha: {', '.join(ruins) or 'status do commit'}.")
                  pendentes = [r["name"] for r in runs if r["status"] != "completed"]
                  if estado["state"] == "pending" and estado["total_count"]:
                      pendentes.append("status do commit")
                  if not pendentes:
                      break
                  if time.time() - inicio > ESPERA_CHECKS:
                      fim(f"Checks ainda rodando: {', '.join(pendentes)}. O proximo evento do PR tenta de novo.")
                  time.sleep(30)

              # 4. Quem aprova: donos do codigo (CODEOWNERS da base) ou o padrao
              cfg = json.loads(os.environ.get("APROVADORES") or "{}")
              pessoas, times = cfg.get("pessoas", {}), cfg.get("times", {})
              arquivos = [f["filename"] for f in gh_todos(f"repos/{REPO}/pulls/{PR}/files")]
              regras = codeowners(pr["base"]["ref"])
              donos = set()
              for arq in arquivos:
                  donos.update(donos_de(regras, arq))
              logins = set()
              for d in donos:
                  d = d.lstrip("@")
                  logins.update(times.get(d, [d]) if "/" in d else [d])
              excluir = {autor, (commit.get("author") or {}).get("login")}
              alvo = sorted(logins - excluir)
              if not alvo:
                  alvo = sorted(set(cfg.get("repos", {}).get(nome) or cfg.get("padrao", [])) - excluir)
              if not alvo:
                  fim("Ninguem configurado para aprovar (variavel APROVADORES_CHAT).")

              # 5. Avisa no Chat e registra no PR
              corpo = (pr.get("body") or "").split("### Checklist")[0]
              resumo = [l.strip(" -*#>") for l in corpo.splitlines() if l.strip() and not l.strip().startswith("<!--")]
              resumo = "\n".join(f"  {l[:200]}" for l in resumo[:4])
              marcas = " ".join(f"<users/{pessoas[l]}>" if l in pessoas else f"@{l}" for l in alvo)
              texto = (f"{marcas} PR pronto para aprovar:\n"
                       f"*<{pr['html_url']}|{nome}#{PR}: {pr['title']}>*\n"
                       f"{pr['head']['ref']} → {pr['base']['ref']} · autor {autor} · "
                       f"{pr['changed_files']} arquivo(s), +{pr['additions']} -{pr['deletions']}\n"
                       f"{resumo}\n"
                       f"✅ {ia} · conversas resolvidas · checks verdes\n"
                       f"Leia o resumo e a revisão no PR e aprove em Files changed → Review changes → Approve.")
              webhook = os.environ.get("WEBHOOK")
              if not webhook:
                  fim("Secret GCHAT_APROVACAO_WEBHOOK ausente: aviso nao enviado.\n" + texto)
              chave = urllib.parse.quote(f"{REPO}#{PR}", safe="")
              url = f"{webhook}&threadKey={chave}&messageReplyOption=REPLY_MESSAGE_FALLBACK_TO_NEW_THREAD"
              r = urllib.request.Request(url, data=json.dumps({"text": texto}).encode(), method="POST",
                                         headers={"Content-Type": "application/json; charset=UTF-8"})
              urllib.request.urlopen(r, timeout=30).read()
              quem = ", ".join(f"@{l}" for l in alvo)
              req(f"{API}/repos/{REPO}/issues/{PR}/comments",
                  {"body": f"Aprovação pedida no Google Chat a {quem}: {ia}, conversas resolvidas e checks verdes "
                           f"no commit {head[:7]}.\n<!-- {MARCA}:{head} -->"}, "POST")
              print(f"Aprovacao pedida a {quem}.")

          def codeowners(ref):
              for p in (".github/CODEOWNERS", "CODEOWNERS", "docs/CODEOWNERS"):
                  try:
                      c = gh(f"repos/{REPO}/contents/{p}?ref={urllib.parse.quote(ref)}")
                  except urllib.error.HTTPError:
                      continue
                  import base64
                  texto = base64.b64decode(c["content"]).decode()
                  regras = []
                  for linha in texto.splitlines():
                      linha = linha.split("#")[0].strip()
                      if linha:
                          partes = linha.split()
                          regras.append((partes[0], partes[1:]))
                  return regras
              return []

          def casa(padrao, caminho):
              if padrao == "*":
                  return True
              ancorado = padrao.startswith("/") or "/" in padrao.rstrip("/")
              p = padrao.lstrip("/")
              if p.endswith("/"):
                  return caminho.startswith(p) if ancorado else any(
                      caminho[i:].startswith(p) for i in [0] + [m.end() for m in re.finditer("/", caminho)])
              if p.endswith("/**"):
                  return caminho.startswith(p[:-2])
              if ancorado:
                  return fnmatch.fnmatchcase(caminho, p) or caminho.startswith(p + "/")
              return any(fnmatch.fnmatchcase(parte, p) for parte in caminho.split("/")) or fnmatch.fnmatchcase(caminho, p)

          def donos_de(regras, caminho):
              donos = []
              for padrao, quem in regras:
                  if casa(padrao, caminho):
                      donos = quem
              return donos

          try:
              principal()
          except SystemExit:
              raise
          except Exception as e:  # nunca derruba o PR
              print(f"::warning::aviso de aprovacao nao enviado: {e}")
